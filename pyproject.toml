[project]
name = "llm-wiki"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "latex2mathml>=3.81.1",
    "lxml>=6.1.3",
    "markdownify>=1.2.3",
    "matplotlib>=3.11.2",
    "open-diagram>=0.5.0",
    "pymupdf>=2.1",
    "pymupdf4llm>=2.1",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "truststore>=0.10.5",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
search = [
    "fastembed>=0.9.1",
]

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tests"]

[tool.ruff]
line-length = 80
target-version = "py312"
# Google style applies to new or rewritten tools only; extend this list as
# older tools are brought up to standard.
include = [
    "tools/_paths.py",
    "tools/_common.py",
    "tools/docsrc/**/*.py",
    "tools/doc.py",
    "tools/ledger.py",
    "tools/wiki.py",
    "tools/relations.py",
    "tools/lifecycle.py",
    "tools/confidence.py",
    "tools/search.py",
    "tools/retention.py",
    "tools/learning.py",
    "tools/questions.py",
    "tools/digest.py",
    "tools/work.py",
    "tools/_limits.py",
    "tools/redact.py",
    "tools/autopilot.py",
    "tools/slides.py",
    "tools/slide_refseq.py",
    "tools/slides_grammar.py",
    "tools/diagram.py",
    "tools/status_migrate.py",
    "tools/study_html.py",
    "tools/agy_acp.py",
    "tools/public_export.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "ANN", "B", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"
